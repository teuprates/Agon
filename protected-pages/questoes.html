<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Banco de Questões | Agon</title>
<link rel="stylesheet" href="/css/styles.css"><link rel="stylesheet" href="/css/tailwind.css"><script src="/js/tailwind-runtime.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{font-family:Inter,system-ui,sans-serif;background:var(--bg-body,#f7f9fc);color:var(--text-primary,#172033)}
.layout{min-height:100vh;display:grid;grid-template-columns:245px minmax(0,1fr)}.sidebar{background:var(--bg-card,#fff);border-right:1px solid var(--border-light,#e5e7eb);padding:24px 16px}
.nav-item{display:flex;gap:12px;padding:10px 12px;border-radius:10px;color:inherit}.nav-item:hover,.nav-item.active{background:#eff6ff;color:#2563eb}
.panel{background:var(--bg-card,#fff);border:1px solid var(--border-light,#e5e7eb);border-radius:16px;padding:20px}
.field{background:var(--bg-input,#fff);border:1px solid var(--border-default,#d1d5db);border-radius:10px;padding:10px;color:inherit;width:100%}
.choice{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--border-light,#e5e7eb);border-radius:12px;cursor:pointer}
.choice.correct{border-color:#10b981;background:#ecfdf5}.choice.incorrect{border-color:#ef4444;background:#fef2f2}
@media(max-width:800px){.layout{grid-template-columns:1fr}.sidebar{display:none}.content{padding:16px}}
</style>
</head>
<body>
<div class="layout">
<aside class="sidebar">
<a href="/dashboard" class="flex items-center gap-2 text-2xl font-extrabold text-blue-600 mb-8"><img src="/assets/img/agon-light.png" alt="" width="34">AGON</a>
<nav class="space-y-1">
<a href="/dashboard" class="nav-item"><i class="fa-solid fa-house w-5"></i>Dashboard</a><a href="/estudos" class="nav-item"><i class="fa-solid fa-book-open w-5"></i>Estudos</a>
<a href="/questoes" class="nav-item active"><i class="fa-solid fa-circle-question w-5"></i>Questões</a><a href="/simulados" class="nav-item"><i class="fa-solid fa-file-signature w-5"></i>Simulados</a>
<a href="/desempenho" class="nav-item"><i class="fa-solid fa-chart-line w-5"></i>Desempenho</a><a href="/ia-tutor" class="nav-item"><i class="fa-solid fa-robot w-5"></i>IA Tutor</a>
<a href="/materiais" class="nav-item"><i class="fa-solid fa-folder-open w-5"></i>Materiais</a><a href="/configuracoes" class="nav-item"><i class="fa-solid fa-gear w-5"></i>Configurações</a>
<button class="btn-logout nav-item w-full text-left mt-8" type="button"><i class="fa-solid fa-right-from-bracket w-5"></i>Sair</button>
</nav></aside>
<main class="content p-6 md:p-10 min-w-0">
<header class="flex flex-wrap justify-between items-center gap-4 mb-8"><div><p class="text-sm text-slate-500">Banco de questões</p><h1 class="text-3xl font-extrabold">Pratique com questões reais</h1></div><div class="flex gap-5 text-sm"><span><b id="today-count">0</b> respondidas hoje</span><span>Sequência: <b id="streak-count">0</b> dias</span></div></header>
<section class="panel mb-6" aria-label="Filtros de questões"><div class="grid gap-3 md:grid-cols-3">
<input class="field" id="filter-busca" type="search" placeholder="Buscar no enunciado ou código">
<select class="field" id="filter-disciplina"><option value="">Todas as disciplinas</option></select><select class="field" id="filter-assunto"><option value="">Todos os assuntos</option></select>
<select class="field" id="filter-banca"><option value="">Todas as bancas</option></select><select class="field" id="filter-ano"><option value="">Todos os anos</option></select>
<select class="field" id="filter-dificuldade"><option value="">Todas as dificuldades</option><option value="facil">Fácil</option><option value="media">Média</option><option value="dificil">Difícil</option></select>
</div><div class="mt-4 flex gap-3"><button class="btn-primary px-5 py-2 rounded-xl" id="apply-filters">Aplicar filtros</button><button class="btn-secondary px-5 py-2 rounded-xl" id="clear-filters">Limpar</button></div></section>
<p id="list-status" class="text-sm text-slate-500 mb-4" role="status">Carregando questões…</p><section id="question-list" class="space-y-4" aria-live="polite"></section>
<section id="empty-state" class="panel text-center hidden"><h2 class="font-bold">Nenhuma questão encontrada</h2><p class="text-sm text-slate-500 mt-2">Ajuste os filtros ou tente novamente mais tarde.</p></section>
<footer class="flex justify-between items-center mt-6 text-sm"><span id="pagination-summary"></span><div class="flex gap-2"><button id="previous-page" class="btn-secondary px-4 py-2 rounded-lg">Anterior</button><span id="page-label" class="px-3 py-2"></span><button id="next-page" class="btn-secondary px-4 py-2 rounded-lg">Próxima</button></div></footer>
<p id="page-error" class="text-red-600 mt-4 hidden" role="alert"></p>
</main></div>
<script src="/js/script.js" defer></script><script src="/js/pages/questoes.js" defer></script>
</body></html>
